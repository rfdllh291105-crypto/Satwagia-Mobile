<script>
/* ============================================================
   STATE & SEED — 66 KARYAWAN KLINIK
   ============================================================ */
const STORAGE_KEY = 'satwagia_hris_v2'; // bumped: 66 karyawan + jobdesc
const TOTAL_EMPLOYEES = 66;

const POSITIONS = [
  {name:'Dokter Hewan', base:9000000},
  {name:'Perawat Hewan', base:4500000},
  {name:'Resepsionis', base:3800000},
  {name:'Admin Klinik', base:4200000},
  {name:'Kasir', base:3800000},
];

/* Jobdesc per jabatan */
const JOBDESCS = {
  'Dokter Hewan':
    'Memeriksa, mendiagnosis, dan mengobati hewan; melakukan tindakan medis & operasi; memberikan edukasi ke pemilik hewan; mengawasi kerja perawat hewan; mencatat rekam medis pasien.',
  'Perawat Hewan':
    'Membantu dokter hewan dalam tindakan medis; merawat hewan rawat inap; menyiapkan alat & obat; monitoring kondisi pasien; sterilisasi alat; mendampingi pemilik hewan.',
  'Resepsionis':
    'Menerima pendaftaran pasien; mengatur jadwal dokter; menjawab telepon & pertanyaan klien; mengelola antrian; konfirmasi kontrol ulang; input data pasien ke sistem.',
  'Admin Klinik':
    'Mengelola administrasi cabang; monitoring stok obat & alat; membuat laporan harian cabang; koordinasi dengan kantor pusat; input & update data pasien.',
  'Kasir':
    'Memproses pembayaran pasien; menerbitkan struk & invoice; rekapitulasi transaksi harian; tutup kasir; setor keuangan ke finance; pelayanan pembayaran klien.',
};

const FIRSTNAMES = ['Budi','Siti','Agus','Dewi','Rian','Nisa','Fajar','Ayu','Bayu','Rina','Hendra','Putri','Yoga','Lestari','Arif','Wulan','Dimas','Sari','Eko','Maya'];
const LASTNAMES  = ['Santoso','Nurhaliza','Setiawan','Lestari','Pratama','Aulia','Ramadhan','Wulandari','Aditya','Marlina'];

let state = null;

function seedData(){
  const branches = Array.from({length:10},(_,i)=>({
    id:i+1, name:'Cabang '+(i+1), address:'Jl. Contoh No.'+(i+1), phone:'021-5550'+(100+i)
  }));

  const employees = [];
  for(let i=0;i<TOTAL_EMPLOYEES;i++){
    const pos = POSITIONS[i%POSITIONS.length];
    const br  = branches[i%10];
    employees.push({
      id:'EMP'+String(i+1).padStart(3,'0'),
      name: FIRSTNAMES[i%FIRSTNAMES.length]+' '+LASTNAMES[i%LASTNAMES.length],
      branchId: br.id,
      position: pos.name,
      jobdesc: JOBDESCS[pos.name],
      base: pos.base,
      allowance: 500000,
      bankName:['BCA','Mandiri','BNI','BRI'][i%4],
      bankAccount: String(1000000000+i),
      joinedAt:'2024-'+String((i%9)+1).padStart(2,'0')+'-15',
      status:'active'
    });
  }

  /* Users: 5 admin/manager + 66 karyawan */
  const users = [
    {username:'superadmin',password:'admin123',name:'Super Admin',role:'superadmin'},
    {username:'hrd',password:'hrd123',name:'Sarah HRD',role:'hrd'},
    {username:'finance',password:'finance123',name:'Budi Finance',role:'finance'},
    {username:'mgr1',password:'mgr123',name:'Andi (Cabang 1)',role:'manager',branchId:1},
    {username:'mgr2',password:'mgr123',name:'Rina (Cabang 2)',role:'manager',branchId:2},
  ];
  /* Setiap 66 karyawan otomatis punya akun: emp001..emp066 / emp123 */
  employees.forEach(e=>users.push({
    username:e.id.toLowerCase(), password:'emp123', name:e.name, role:'employee', employeeId:e.id
  }));

  /* Absensi 30 hari terakhir (weekday only) */
  const attendances = [];
  const today = new Date();
  for(let d=1; d<=30; d++){
    const date = new Date(today); date.setDate(date.getDate()-d);
    if(date.getDay()===0||date.getDay()===6) continue;
    const ds = date.toISOString().slice(0,10);
    employees.forEach((e,idx)=>{
      const r = (idx+d*3)%12;
      let status='hadir', inTime='08:00', outTime='17:00', late=0;
      if(r===0){status='izin';inTime='-';outTime='-';}
      else if(r===1){status='sakit';inTime='-';outTime='-';}
      else if(r===2){inTime='08:15';late=15;}
      else if(r===3){inTime='08:30';late=30;}
      else if(r===4){inTime='08:45';late=45;}
      attendances.push({
        id:'ATT'+ds.replace(/-/g,'')+e.id,
        empId:e.id, date:ds, inTime, outTime,
        lateMinutes:late, status, source:'workting'
      });
    });
  }

  /* Lembur */
  const overtimeRequests = [];
  employees.slice(0,20).forEach((e,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(i%15));
    overtimeRequests.push({
      id:'OT'+String(i+1).padStart(3,'0'),
      empId:e.id, branchId:e.branchId,
      date:d.toISOString().slice(0,10),
      hours:[1,2,3,2,1.5,4][i%6],
      reason:['Closing bulanan','Extra shift','Emergency','Stock opname','Kunjungan luar'][i%5],
      status:['approved','approved','pending','pending','rejected'][i%5],
      approvedBy:i<2?'Sarah HRD':null,
      approvedAt:i<2?new Date().toISOString():null,
      createdAt:d.toISOString()
    });
  });

  /* Cuti/Izin */
  const leaveRequests = employees.slice(0,12).map((e,i)=>{
    const d = new Date(); d.setDate(d.getDate()+(i+2));
    return {
      id:'LV'+String(i+1).padStart(3,'0'),
      empId:e.id, branchId:e.branchId,
      type:['cuti','izin','sakit'][i%3],
      startDate:d.toISOString().slice(0,10),
      endDate:d.toISOString().slice(0,10),
      reason:['Keperluan keluarga','Sakit demam','Urusan pribadi'][i%3],
      status:i%3===0?'approved':'pending',
      approvedBy:i%3===0?'Sarah HRD':null,
      createdAt:d.toISOString()
    };
  });

  const st = {
    branches, employees, users, attendances, overtimeRequests, leaveRequests,
    payrollRuns:[], auditLog:[], currentUser:null, version:2
  };

  /* Seed 1 payroll published bulan lalu */
  const prev = new Date(); prev.setMonth(prev.getMonth()-1);
  const period = prev.toISOString().slice(0,7);
  const rows = computeRowsForPeriod(st, period);
  st.payrollRuns.push({
    id:'PR-'+period, period, rows, status:'published',
    createdBy:'Budi Finance', createdAt:prev.toISOString(),
    finalizedAt:prev.toISOString(), publishedAt:prev.toISOString()
  });
  st.auditLog.push({ts:prev.toISOString(),user:'system',action:'Seed 66 karyawan + payroll '+period+' published'});
  return st;
}

function computeRowsForPeriod(st, period){
  return st.employees.map(e=>{
    const att = st.attendances.filter(a=>a.empId===e.id && a.date.startsWith(period));
    const hadir = att.filter(a=>a.status==='hadir').length;
    const alpha = att.filter(a=>a.status!=='hadir').length;
    const lateMin = att.reduce((s,a)=>s+(a.lateMinutes||0),0);
    const ots = st.overtimeRequests.filter(o=>o.empId===e.id && o.status==='approved' && o.date.startsWith(period));
    const otHours = ots.reduce((s,o)=>s+o.hours,0);
    const hourlyRate = e.base/173;
    const overtimePay = Math.round(otHours*hourlyRate*1.5);
    const lateDeduction = Math.floor(lateMin/60)*50000;
    const absenceDeduction = alpha*Math.round(e.base/22);
    const bpjs = Math.round(e.base*0.02);
    const pph21 = e.base>5000000?Math.round(e.base*0.05):0;
    const gross = e.base+e.allowance+overtimePay;
    const deductions = lateDeduction+absenceDeduction+bpjs+pph21;
    const net = gross-deductions;
    return {
      empId:e.id, name:e.name, branchId:e.branchId, position:e.position,
      bankName:e.bankName, bankAccount:e.bankAccount,
      base:e.base, allowance:e.allowance,
      otHours, overtimePay, lateMinutes:lateMin, lateDeduction,
      hadir, alpha, absenceDeduction, bpjs, pph21,
      gross, deductions, net
    };
  });
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const s = JSON.parse(raw);
      if(s.version===2) return s;
    }catch(e){}
  }
  const s = seedData();
  saveState(s);
  return s;
}
function saveState(s){ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
function persist(){ saveState(state); }

/* ============================================================
   HELPERS
   ============================================================ */
const fmt = n => 'Rp '+Number(n||0).toLocaleString('id-ID');
const fmtDate = d => d? new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';
const branchName = id => (state.branches.find(b=>b.id===id)||{}).name||'-';
const empById = id => state.employees.find(e=>e.id===id);
function badge(s){
  const m={
    hadir:'bg-green-100 text-green-700', izin:'bg-blue-100 text-blue-700',
    sakit:'bg-yellow-100 text-yellow-700', alpha:'bg-red-100 text-red-700',
    pending:'bg-yellow-100 text-yellow-700', approved:'bg-green-100 text-green-700',
    rejected:'bg-red-100 text-red-700', draft:'bg-slate-100 text-slate-700',
    finalized:'bg-blue-100 text-blue-700', published:'bg-green-100 text-green-700',
    active:'bg-green-100 text-green-700'
  };
  return '<span class="px-2 py-0.5 rounded text-xs font-medium whitespace-nowrap '+(m[s]||'bg-slate-100')+'">'+s+'</span>';
}
function audit(action){
  state.auditLog.unshift({
    ts:new Date().toISOString(),
    user:state.currentUser?state.currentUser.name:'system',
    action
  });
  if(state.auditLog.length>200) state.auditLog=state.auditLog.slice(0,200);
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); document.body.classList.remove('overflow-hidden'); }
function openModal(html){ document.getElementById('modalContent').innerHTML=html; document.getElementById('modal').classList.remove('hidden'); document.body.classList.add('overflow-hidden'); }
function toast(msg,type){
  const c = type==='err'?'bg-red-600':(type==='warn'?'bg-yellow-600':'bg-green-600');
  const d = document.createElement('div');
  d.className='fixed bottom-4 left-4 right-4 md:left-auto md:right-4 md:max-w-sm '+c+' text-white px-4 py-3 rounded shadow-lg text-sm z-50 text-center md:text-left';
  d.textContent=msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),2500);
}

/* ============================================================
   MODAL DETAIL KARYAWAN + JOBDESC (shared, dipakai semua role)
   ============================================================ */
window.viewEmpDetail = empId=>{
  const e = empById(empId); if(!e) return;
  const todayStr = new Date().toISOString().slice(0,10);
  const todayAtt = state.attendances.find(a=>a.empId===e.id && a.date===todayStr);
  const myOT = state.overtimeRequests.filter(o=>o.empId===e.id && o.status==='approved').reduce((s,o)=>s+o.hours,0);
  const myPayslip = state.payrollRuns.filter(r=>r.status==='published' && r.rows.some(x=>x.empId===e.id)).slice(-1)[0];

  openModal(
    '<div class="flex items-start justify-between gap-3 mb-3">'+
      '<div class="flex items-center gap-2"><span class="text-2xl">🐾</span>'+
        '<div><h3 class="font-bold text-base md:text-lg leading-none">'+e.name+'</h3>'+
        '<p class="text-xs text-slate-500">'+e.id+' · '+e.position+'</p></div>'+
      '</div>'+
      '<button onclick="closeModal()" class="p-1 rounded hover:bg-slate-100"><svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>'+
    '</div>'+
    '<div class="bg-teal-50 rounded p-3 mb-3">'+
      '<p class="text-xs font-semibold text-teal-800 mb-1">📋 Jobdesc — '+e.position+'</p>'+
      '<p class="text-sm text-slate-700 leading-relaxed">'+e.jobdesc+'</p>'+
    '</div>'+
    '<div class="grid grid-cols-2 gap-2 text-sm mb-3">'+
      '<div><span class="text-slate-500">Cabang:</span> '+branchName(e.branchId)+'</div>'+
      '<div><span class="text-slate-500">Status:</span> '+badge(e.status)+'</div>'+
      '<div><span class="text-slate-500">Gaji Pokok:</span> '+fmt(e.base)+'</div>'+
      '<div><span class="text-slate-500">Tunjangan:</span> '+fmt(e.allowance)+'</div>'+
      '<div class="col-span-2"><span class="text-slate-500">Rekening:</span> '+e.bankName+' · '+e.bankAccount+'</div>'+
      '<div class="col-span-2"><span class="text-slate-500">Masuk:</span> '+fmtDate(e.joinedAt)+'</div>'+
    '</div>'+
    '<div class="grid grid-cols-3 gap-2 text-center text-xs mb-3">'+
      '<div class="bg-slate-50 p-2 rounded"><p class="text-slate-500">Hari ini</p><p class="font-bold">'+(todayAtt?todayAtt.status:'belum')+'</p></div>'+
      '<div class="bg-slate-50 p-2 rounded"><p class="text-slate-500">Lembur (appr)</p><p class="font-bold">'+myOT+' jam</p></div>'+
      '<div class="bg-slate-50 p-2 rounded"><p class="text-slate-500">Slip terbaru</p><p class="font-bold">'+(myPayslip?'Ada':'—')+'</p></div>'+
    '</div>'+
    '<div class="flex gap-2 no-print sticky bottom-0 bg-white pt-2">'+
      '<button onclick="closeModal()" class="flex-1 bg-slate-200 py-2.5 rounded text-sm">Tutup</button>'+
    '</div>'
  );
};

/* ============================================================
   SIDEBAR DRAWER
   ============================================================ */
function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  const isOpen = !sb.classList.contains('-translate-x-full');
  if(isOpen){ closeSidebarDrawer(); }
  else {
    sb.classList.remove('-translate-x-full');
    bd.classList.remove('hidden');
    document.body.classList.add('overflow-hidden');
  }
}
function closeSidebarDrawer(){
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('sidebar-backdrop').classList.add('hidden');
  document.body.classList.remove('overflow-hidden');
}

/* ============================================================
   AUTH
   ============================================================ */
function fillLogin(u,p){ document.getElementById('inUser').value=u; document.getElementById('inPass').value=p; }
function doLogin(){
  const u = document.getElementById('inUser').value.trim();
  const p = document.getElementById('inPass').value;
  const usr = state.users.find(x=>x.username===u && x.password===p);
  if(!usr){
    const err = document.getElementById('loginErr');
    err.textContent='Username atau password salah.'; err.classList.remove('hidden'); return;
  }
  state.currentUser = { username:usr.username, name:usr.name, role:usr.role,
    branchId:usr.branchId||null, employeeId:usr.employeeId||null };
  audit('Login sebagai '+usr.role);
  persist();
  showApp();
}
function doLogout(){
  closeSidebarDrawer();
  audit('Logout');
  state.currentUser=null; persist();
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

    '<div class="mt-4 pt-4 border-t text-xs text-slate-400 px-2">© Satwagia HRIS</div>';

}

/* ============================================================
   ROUTER
   ============================================================ */
const VIEWS = {};
function go(key){
  activeMenu = key;
  renderSidebar();
  const fn = VIEWS[key];
  document.getElementById('main').innerHTML = fn ? fn() : '<p>Halaman tidak ditemukan.</p>';
  window.scrollTo(0,0);
}

window.downloadBankFile = prId=>{
  const pr = state.payrollRuns.find(r=>r.id===prId); if(!pr) return;
  const rows = [['No','Bank','No Rekening','Nama','Nominal','Berita']];
  pr.rows.forEach((r,i)=>{
    rows.push([i+1, r.bankName, r.bankAccount, r.name, r.net, 'Gaji '+pr.period]);
  });
  const csv = rows.map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='payroll-'+pr.period+'.csv'; a.click();
  URL.revokeObjectURL(url);
  audit('Download bank file '+pr.period);
  toast('CSV berhasil diunduh');
};

  const myAtt = state.attendances.filter(a=>a.empId===e.id && a.date===todayStr);
  const att = myAtt[0];
  const myOT = state.overtimeRequests.filter(o=>o.empId===e.id);
  const myLV = state.leaveRequests.filter(l=>l.empId===e.id);
  const myPayslips = state.payrollRuns.filter(r=>r.status==='published' && r.rows.some(x=>x.empId===e.id));

    '<p class="text-xs md:text-sm text-slate-500 mb-3 md:mb-4">'+e.position+' · '+branchName(e.branchId)+'</p>'+
    '<div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-4 md:mb-6">'+
      statCard('Hari Ini', att?(att.status==='hadir'?att.inTime:'Izin'):'Belum','⏰',att?'bg-green-50':'bg-red-50')+

      statCard('Cuti/Izin', myLV.length,'📝','bg-purple-50')+

    '</div>'+
    '<div class="bg-teal-50 rounded-lg p-3 mb-4">'+
      '<p class="text-xs font-semibold text-teal-800 mb-1">📋 Jobdesc Saya — '+e.position+'</p>'+
      '<p class="text-xs md:text-sm text-slate-700 leading-relaxed">'+e.jobdesc+'</p>'+
    '</div>'+
    '<div class="grid md:grid-cols-2 gap-3 md:gap-4">'+
      '<div class="bg-white rounded-lg p-3 md:p-4 shadow-sm"><h3 class="font-semibold mb-2 text-sm md:text-base">Slip Gaji Terbaru</h3>'+
        (myPayslips.length?myPayslips.slice(-1).map(pr=>{
          const r = pr.rows.find(x=>x.empId===e.id);
          return '<div class="text-sm"><p class="text-xs text-slate-500">Periode <b>'+pr.period+'</b></p><p class="text-xl md:text-2xl font-bold text-teal-700 mt-1">'+fmt(r.net)+'</p>'+
            '<button onclick="viewMyPayslip(\''+pr.id+'\')" class="mt-2 text-xs bg-teal-600 text-white px-3 py-1.5 rounded">Lihat Slip</button></div>';
        }).join(''):'<p class="text-sm text-slate-400">Belum ada slip.</p>')+
      '</div>'+
      '<div class="bg-white rounded-lg p-3 md:p-4 shadow-sm"><h3 class="font-semibold mb-2 text-sm md:text-base">Request Terakhir</h3>'+
        '<ul class="text-xs md:text-sm space-y-1.5">'+
        [...myOT.slice(-2).map(o=>'<li class="flex justify-between gap-2"><span>🕒 Lembur '+o.hours+'j · '+fmtDate(o.date)+'</span>'+badge(o.status)+'</li>'),
         ...myLV.slice(-2).map(l=>'<li class="flex justify-between gap-2"><span>📝 '+l.type+' · '+fmtDate(l.startDate)+'</span>'+badge(l.status)+'</li>')].join('')||
        '<li class="text-slate-400">Belum ada request</li>'+
        '</ul></div>'+
    '</div>';
};

VIEWS['emp-clock'] = ()=>{
  const e = me();
  const todayStr = new Date().toISOString().slice(0,10);
  const todayAtt = state.attendances.find(a=>a.empId===e.id && a.date===todayStr);
  const last7 = state.attendances.filter(a=>a.empId===e.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
  const clockBtn = todayAtt
    ? '<div class="bg-green-50 p-3 md:p-4 rounded mb-4"><p class="text-xs text-slate-600">Absensi hari ini:</p>'+
      '<p class="text-sm md:text-base font-bold mt-1">'+badge(todayAtt.status)+' · In: '+todayAtt.inTime+' — Out: '+(todayAtt.outTime==='-'?'-':todayAtt.outTime)+'</p></div>'
    : '<button onclick="doClockIn()" class="w-full bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white px-6 py-3 rounded font-medium mb-4 text-base">📸 Clock In Sekarang</button>';
  const rows = last7.map(a=>
    '<tr class="border-b"><td class="py-2 px-3 whitespace-nowrap">'+fmtDate(a.date)+'</td>'+
    '<td class="py-2 px-3 font-mono">'+a.inTime+'</td>'+
    '<td class="py-2 px-3 font-mono">'+a.outTime+'</td>'+
    '<td class="py-2 px-3">'+badge(a.status)+(a.lateMinutes?' ('+a.lateMinutes+'m)':'')+'</td></tr>'
  ).join('');
  return '<h2 class="text-lg md:text-xl font-bold mb-3">Absensi Saya</h2>'+clockBtn+
    scrollHint()+
    '<div class="bg-white rounded-lg shadow-sm overflow-x-auto"><table class="w-full text-sm">'+
    tableHead(['Tanggal','In','Out','Status'])+'<tbody>'+rows+'</tbody></table></div>';
};
window.doClockIn = ()=>{
  const e = me();
  const todayStr = new Date().toISOString().slice(0,10);
  if(state.attendances.find(a=>a.empId===e.id && a.date===todayStr)){
    toast('Anda sudah clock in hari ini','warn'); return;
  }
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const late = Math.max(0, (now.getHours()*60+now.getMinutes()) - (8*60));
  state.attendances.push({
    id:'ATT'+todayStr.replace(/-/g,'')+e.id+'-live',
    empId:e.id, date:todayStr, inTime:hhmm, outTime:'-',
    lateMinutes:late, status:'hadir', source:'self-clockin',
    gps:'-6.2, 106.8', selfie:true
  });
  audit('Clock in '+e.id); persist();
  toast('✓ Clock in berhasil — '+hhmm+' (GPS valid)');
  go('emp-clock');
};

VIEWS['emp-ot'] = ()=>{
  const e = me();
  const myOT = state.overtimeRequests.filter(o=>o.empId===e.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));

    '<tr class="border-b"><td class="py-2 px-3 font-mono text-xs">'+o.id+'</td>'+

  ).join('') || '<tr><td colspan="5" class="py-4 text-center text-slate-400 text-sm">Belum ada pengajuan.</td></tr>';

      '<div class="grid grid-cols-2 md:grid-cols-3 gap-2 md:gap-3 text-sm">'+
        '<div class="col-span-2 md:col-span-1"><label class="text-xs text-slate-600">Tanggal</label><input id="otDate" type="date" value="'+new Date().toISOString().slice(0,10)+'" class="w-full border rounded px-3 py-2 mt-1"></div>'+
        '<div><label class="text-xs text-slate-600">Jam</label><input id="otHours" type="number" step="0.5" min="0.5" value="2" class="w-full border rounded px-3 py-2 mt-1"></div>'+
        '<div class="col-span-2 md:col-span-3"><label class="text-xs text-slate-600">Alasan</label><input id="otReason" type="text" placeholder="Contoh: extra shift" class="w-full border rounded px-3 py-2 mt-1"></div>'+
      '</div>'+
      '<button onclick="submitOT()" class="mt-3 w-full md:w-auto bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white px-4 py-2.5 rounded text-sm">Ajukan Lembur</button>'+
    '</div>'+
    scrollHint()+
    '<div class="bg-white rounded-lg shadow-sm overflow-x-auto"><table class="w-full text-sm">'+
    tableHead(['ID','Tanggal','Jam','Alasan','Status'])+'<tbody>'+rows+'</tbody></table></div>';

window.submitOT = ()=>{
  const e = me();
  const h = parseFloat(document.getElementById('otHours').value);
  const date = document.getElementById('otDate').value;
  const reason = document.getElementById('otReason').value||'-';
  if(!date||!h){ toast('Lengkapi form','err'); return; }
  const newId = 'OT'+String(state.overtimeRequests.length+1).padStart(3,'0');
  state.overtimeRequests.push({
    id:newId, empId:e.id, branchId:e.branchId,
    date, hours:h, reason, status:'pending',
    approvedBy:null, approvedAt:null, createdAt:new Date().toISOString()
  });
  audit('Ajukan lembur '+newId+' oleh '+e.id); persist();
  toast('Lembur diajukan — menunggu approval');
  go('emp-ot');
};

    scrollHint()+

window.submitLeave = ()=>{
  const e = me();

  const start = document.getElementById('lvStart').value;
  const end = document.getElementById('lvEnd').value;
  const reason = document.getElementById('lvReason').value||'-';
  if(!start||!end){ toast('Lengkapi tanggal','err'); return; }
  const newId = 'LV'+String(state.leaveRequests.length+1).padStart(3,'0');
  state.leaveRequests.push({
    id:newId, empId:e.id, branchId:e.branchId,
    type, startDate:start, endDate:end, reason,
    status:'pending', approvedBy:null, createdAt:new Date().toISOString()
  });
  audit('Ajukan '+type+' '+newId+' oleh '+e.id); persist();
  toast('Pengajuan dikirim — menunggu approval'); go('emp-leave');
};

window.viewMyPayslip = prId=>{
  const pr = state.payrollRuns.find(r=>r.id===prId); if(!pr) return;
  const e = me();
