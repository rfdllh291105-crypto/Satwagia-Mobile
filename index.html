<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Klinik Satwagia — HRIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-slate-800">

  <!-- LOGIN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-white via-purple-50 to-yellow-50">
    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 w-full max-w-md border border-purple-100">
      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-purple-100 flex items-center justify-center text-3xl mb-3">🐾</div>
        <h1 class="text-xl md:text-2xl font-bold text-purple-900">Klinik Satwagia</h1>
        <p class="text-xs md:text-sm text-purple-500">HRIS · Attendance · Payroll</p>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-600 font-medium">Username</label>
          <input id="inUser" type="text" autocomplete="username" value="superadmin" class="w-full border border-purple-200 rounded-lg px-3 py-2.5 mt-1 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
        </div>
        <div>
          <label class="text-xs text-slate-600 font-medium">Password</label>
          <input id="inPass" type="password" autocomplete="current-password" value="admin123" class="w-full border border-purple-200 rounded-lg px-3 py-2.5 mt-1 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
        </div>
        <button onclick="doLogin()" class="w-full bg-purple-600 hover:bg-purple-700 active:bg-purple-800 text-white py-3 rounded-lg font-medium text-base shadow-md">Masuk</button>
        <p id="loginErr" class="text-red-600 text-xs text-center hidden"></p>
      </div>
      <div class="mt-6 border-t border-purple-100 pt-4">
        <p class="text-xs text-slate-500 mb-2">Demo akun (tap untuk isi otomatis):</p>
        <div class="grid grid-cols-2 gap-1.5 text-[11px] font-mono">
          <button onclick="fillLogin('superadmin','admin123')" class="text-left px-2 py-1.5 bg-purple-50 rounded text-purple-800 hover:bg-purple-100">superadmin/admin123</button>
          <button onclick="fillLogin('hrd','hrd123')" class="text-left px-2 py-1.5 bg-purple-50 rounded text-purple-800 hover:bg-purple-100">hrd/hrd123</button>
          <button onclick="fillLogin('finance','finance123')" class="text-left px-2 py-1.5 bg-purple-50 rounded text-purple-800 hover:bg-purple-100">finance/finance123</button>
          <button onclick="fillLogin('mgr1','mgr123')" class="text-left px-2 py-1.5 bg-purple-50 rounded text-purple-800 hover:bg-purple-100">mgr1/mgr123</button>
          <button onclick="fillLogin('mgr2','mgr123')" class="text-left px-2 py-1.5 bg-purple-50 rounded text-purple-800 hover:bg-purple-100">mgr2/mgr123</button>
          <button onclick="fillLogin('emp001','emp123')" class="text-left px-2 py-1.5 bg-yellow-100 rounded text-yellow-900 hover:bg-yellow-200">emp001/emp123</button>
        </div>
        <p class="text-[11px] text-slate-400 mt-2 leading-snug">💡 <b>66 karyawan klinik</b> punya akun: <span class="font-mono text-purple-700">emp001</span> – <span class="font-mono text-purple-700">emp066</span>, password <span class="font-mono">emp123</span></p>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="app-screen" class="hidden min-h-screen flex flex-col bg-white">
    <header class="bg-purple-700 text-white px-3 md:px-6 py-3 flex items-center justify-between no-print sticky top-0 z-30 shadow-md">
      <div class="flex items-center gap-2 md:gap-3 min-w-0">
        <button onclick="toggleSidebar()" class="md:hidden p-2 -ml-2 rounded hover:bg-purple-800 active:bg-purple-900" aria-label="Menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="text-xl md:text-2xl">🐾</span>
        <div class="min-w-0">
          <h1 class="font-bold leading-none text-sm md:text-base truncate">Klinik Satwagia</h1>
          <p class="text-[10px] md:text-xs text-yellow-200 hidden md:block">HRIS System</p>
        </div>
      </div>
      <div class="flex items-center gap-2 md:gap-3 text-sm">
        <div class="text-right min-w-0">
          <div id="hdrName" class="font-medium leading-none text-xs md:text-sm truncate max-w-[110px] md:max-w-none"></div>
          <div id="hdrRole" class="text-[10px] md:text-xs text-yellow-200 truncate max-w-[110px] md:max-w-none"></div>
        </div>
        <button onclick="doLogout()" class="bg-purple-800 hover:bg-purple-900 active:bg-black px-2 md:px-3 py-1.5 rounded text-xs whitespace-nowrap">Logout</button>
      </div>
    </header>

    <div class="flex flex-1 relative">
      <div id="sidebar-backdrop" onclick="closeSidebarDrawer()" class="hidden md:hidden fixed inset-0 bg-purple-900/60 z-30"></div>
      <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 md:w-56 bg-white border-r border-purple-100 h-full md:min-h-screen p-3 pt-20 md:pt-3 transform -translate-x-full md:translate-x-0 transition-transform duration-200 no-print overflow-y-auto"></aside>
      <main id="main" class="flex-1 min-w-0 p-3 md:p-6 pb-16 md:pb-6 bg-white"></main>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal" class="hidden fixed inset-0 bg-purple-900/60 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
    <div id="modalContent" class="bg-white rounded-t-2xl md:rounded-xl shadow-xl max-w-3xl w-full p-4 md:p-6 max-h-[94vh] overflow-y-auto"></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
